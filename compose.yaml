services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vttg_modules
      POSTGRES_USER: vttg_modules
      POSTGRES_PASSWORD: vttg_modules
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vttg_modules -d vttg_modules"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - vttg-modules-postgres:/var/lib/postgresql/data

volumes:
  vttg-modules-postgres:
